<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #2c3e50, #3a4a5a);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }
  .container {
    text-align: center;
    color: white;
  }
  /* TEXT */
  .text {
    font-size: 24px;
    font-weight: 600;
    opacity: 0;
    transform: scale(0.8);
    animation: textPop 0.6s ease-out forwards;
  }
  /* LOGO */
  .logo {
    width: 140px;
    margin-top: 40px;
    opacity: 0;
    transform: scale(0.8);
    animation: logoPop 0.6s ease-out forwards;
    animation-delay: 0.6s; /* appears after text */
  }
  /* TEXT POP ANIMATION */
  @keyframes textPop {
    0% {
      opacity: 0;
      transform: scale(0.7);
    }
    60% {
      opacity: 1;
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  /* LOGO POP ANIMATION */
  @keyframes logoPop {
    0% {
      opacity: 0;
      transform: scale(0.7);
    }
    60% {
      opacity: 1;
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="text">Your safety companion.......</div>
  <img src="logo.png" class="logo" alt="App Logo">
</div>
<script>
  // Optional: redirect after 2 seconds
  setTimeout(() => {
    window.location.href = "index.html"; // change to your main page
  }, 2000);
</script>
</body>
</html>
