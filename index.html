<!DOCTYPE html>
<html>
<head>
    <title>RapidSOS App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="phone">

    <h2>🚨 RapidSOS</h2>
    <p id="location">📍 Detecting location...</p>

    <!-- SOS -->
    <button class="sos" onclick="triggerSOS()">🚨 SOS</button>

    <!-- Add Contact -->
    <div class="card">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="phone" placeholder="Phone">
        <button onclick="addContact()">➕ Add</button>
    </div>

    <!-- Actions -->
    <button onclick="viewContacts()">📞 View Contacts</button>

    <div class="card">
        <input type="text" id="route" placeholder="Blocked Route">
        <button onclick="findRoute()">🛣️ Find Route</button>
    </div>

    <div id="output"></div>

</div>

<script>
let contacts = [];

// 🌍 Get REAL live location

function getLocation() {

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(
            async (pos) => {

                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;

                try {

                    let response = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
                    );

                    let data = await response.json();

                    let city =
                        data.address.city ||
                        data.address.town ||
                        data.address.village ||
                        data.address.state ||
                        "Unknown";

                    document.getElementById("location").innerHTML =
                        `📍 Location: ${city}`;

                } catch (error) {

                    document.getElementById("location").innerHTML =
                        "📍 Location detected";

                }

            },

            (error) => {

                document.getElementById("location").innerHTML =
                    "⚠️ Please allow location access";

            }

        );

    } else {

        document.getElementById("location").innerHTML =
            "❌ Location not supported";

    }

}

// Call location on load
getLocation();

// ➕ Add Contact (NO DUPLICATES)
function addContact() {
    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();

    if (!name || !phone) {
        output("⚠️ Enter all details!");
        return;
    }

    // Check duplicates
    let exists = contacts.some(c =>
        c.name === name || c.phone === phone
    );

    if (exists) {
        output("❌ Duplicate contact not allowed!");
        return;
    }

    contacts.push({name, phone});
    output("✅ Contact Added!");
}

// 📞 View Contacts
function viewContacts() {
    if (contacts.length === 0) {
        output("No contacts found");
        return;
    }

    let list = "📞 Contacts:<br>";
    contacts.forEach(c => {
        list += `👤 ${c.name} - ${c.phone}<br>`;
    });

    output(list);
}

// 🚨 SOS
function triggerSOS() {
    if (contacts.length === 0) {
        output("⚠️ No contacts!");
        return;
    }

    let locationText = document.getElementById("location").innerText;

    let msg = "🚨 SOS SENT 🚨<br>" + locationText + "<br><br>";

    contacts.forEach(c => {
        msg += `Alert sent to ${c.name}<br>`;
    });

    output(msg);
}

// 🛣️ Route
function findRoute() {
    let blocked = document.getElementById("route").value;

    if (blocked === "Market-Hospital") {
        output("🛣️ Safe Route:<br>Home → School → Shelter → Hospital");
    } else if (blocked === "Home-Market") {
        output("🛣️ Safe Route:<br>Home → School → Hospital");
    } else {
        output("🛣️ Default Route:<br>Home → Market → Hospital");
    }
}

// Output helper
function output(msg) {
    document.getElementById("output").innerHTML = msg;
}
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker Registered"));
}
</script>

</body>
</html>
