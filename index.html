<!DOCTYPE html>
<html>
<head>
<title>RapidSOS App</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>

<div class="phone">

<h2>🚨 RapidSOS</h2>

<p id="location">📍 Detecting location...</p>

<!-- 🚨 SOS BUTTON -->
<button class="sos" onclick="triggerSOS()">🚨 SOS</button>

<button class="sos" onclick="sendToAll()">📨 Alert All</button>

<button class="sos" onclick="callPolice()">📞 Call Police</button>

<button class="sos" onclick="startVoice()">🎤 Voice SOS</button>

<!-- 🚨 DEFAULT EMERGENCY NUMBERS -->

<div class="card">

<h3>🚨 Emergency Numbers</h3>


<button class="sos" onclick="window.location.href='tel:100'">
🚓 Call Police (100)
</button>

<button class="sos" onclick="window.location.href='tel:108'">
🚑 Call Ambulance (108)
</button>

<button class="sos" onclick="window.location.href='tel:101'">
🔥 Call Fire (101)
</button>

</div>

<!-- ➕ ADD CONTACT -->

<div class="card">

<input type="text" id="name" placeholder="Name">

<input type="text" id="phone" placeholder="Phone">

<button onclick="addContact()">➕ Add Contact</button>

</div>

<button onclick="viewContacts()">📞 View Contacts</button>

<!-- 🛣️ ROUTE -->

<div class="card">

<input type="text" id="route" placeholder="Blocked Route">

<button onclick="findRoute()">🛣️ Find Route</button>

</div>

<div id="output"></div>

</div>

<script>

// Default Contacts

let contacts = [];



// 🌍 GET LOCATION

function getLocation() {

if (navigator.geolocation) {

navigator.geolocation.getCurrentPosition(

async (pos) => {

window.lat = pos.coords.latitude;

window.lon = pos.coords.longitude;

try {

let response = await fetch(

`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`

);

let data = await response.json();

let city =

data.address.city ||

data.address.town ||

data.address.village ||

"Unknown";

document.getElementById("location").innerHTML =

`📍 Location: ${city}`;

}

catch {

document.getElementById("location").innerHTML =

"📍 Location detected";

}

},

() => {

document.getElementById("location").innerHTML =

"⚠️ Allow location access";

}

);

}

}

getLocation();

// ➕ ADD CONTACT

function addContact() {

let name = document.getElementById("name").value.trim();

let phone = document.getElementById("phone").value.trim();

if (!name || !phone) {

output("⚠️ Enter details!");

return;

}

let exists = contacts.some(c =>

c.name === name || c.phone === phone

);

if (exists) {

output("❌ Duplicate contact not allowed!");

return;

}

contacts.push({ name, phone });

output("✅ Contact Added!");

}


// 📞 VIEW CONTACTS

function viewContacts() {

let list = "📞 Contacts:<br>";

contacts.forEach(c => {

list += `👤 ${c.name} - <a href="tel:${c.phone}">${c.phone}</a><br>`;

});

output(list);

}


// 🚨 SOS COUNTDOWN

function triggerSOS() {

let count = 3;

let box = document.getElementById("output");

let timer = setInterval(() => {

box.innerHTML = `🚨 Sending SOS in ${count}...`;

count--;

if (count < 0) {

clearInterval(timer);

sendSOS();

}

}, 1000);

}


// 📩 SEND SOS

function sendSOS() {

let locationText = document.getElementById("location").innerText;

let mapLink =

window.lat ?

`https://www.google.com/maps?q=${lat},${lon}`

: "";

let message =

`🚨 EMERGENCY!\n${locationText}\n${mapLink}`;

window.location.href =

`sms:?body=${encodeURIComponent(message)}`;

output("🚨 SOS Ready!");

}


// 📨 SEND TO ALL

function sendToAll() {

if (contacts.length === 0) {

output("⚠️ No contacts!");

return;

}

let locationText =

document.getElementById("location").innerText;

let numbers = contacts.map(c => c.phone).join(",");

let mapLink =

window.lat ?

`https://www.google.com/maps?q=${lat},${lon}`

: "";

let message =

`🚨 EMERGENCY!\n${locationText}\n${mapLink}`;

window.location.href =

`sms:${numbers}?body=${encodeURIComponent(message)}`;

output("📨 Alert ready!");

}


// 📞 CALL POLICE

function callPolice() {

window.location.href = "tel:100";

}


// 🎤 VOICE SOS

function startVoice() {

let recognition =

new (window.SpeechRecognition ||

window.webkitSpeechRecognition)();

recognition.start();

recognition.onresult = function(event) {

let speech =

event.results[0][0].transcript.toLowerCase();

if (speech.includes("help")) {

triggerSOS();

}

};

}


// 📳 SHAKE DETECTION

let lastX = null;

window.addEventListener("devicemotion", function(event) {

let x = event.accelerationIncludingGravity.x;

if (lastX !== null) {

let diff = Math.abs(x - lastX);

if (diff > 15) {

triggerSOS();

}

}

lastX = x;

});


// 🛣️ ROUTE

function findRoute() {

let blocked =

document.getElementById("route").value;

if (blocked === "Market-Hospital") {

output(

"🛣️ Safe Route:<br>Home → School → Shelter → Hospital"

);

}

else if (blocked === "Home-Market") {

output(

"🛣️ Safe Route:<br>Home → School → Hospital"

);

}

else {

output(

"🛣️ Default Route:<br>Home → Market → Hospital"

);

}

}


// Output helper

function output(msg) {

document.getElementById("output").innerHTML = msg;

}


// Service Worker

if ("serviceWorker" in navigator) {

navigator.serviceWorker.register("service-worker.js");

}

</script>

</body>

</html>
