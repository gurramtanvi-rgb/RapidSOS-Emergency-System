<!DOCTYPE html>
<html>
<head>
<title>RapidSOS App</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* 🚨 Emergency Grid Layout */

.emergency-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  justify-items: center;
}

.emergency-grid button {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  border-radius: 12px;
}

/* Center last row */

.emergency-grid button:nth-last-child(2):nth-child(3n+1) {
  grid-column: 2;
}

.emergency-grid button:last-child:nth-child(3n+1) {
  grid-column: 2;
}

</style>

</head>

<body>

<!-- Splash Screen -->

<div id="splash">
  <div class="container">
    <div class="text">Your Safety Companion</div>
    <img src="icon.png" class="splash-icon">
  </div>
</div>

<div id="mainApp" style="display:none;">

<div class="phone">

<h2>🚨 RapidSOS</h2>

<p id="location">📍 Detecting location...</p>

<!-- MAIN SOS -->

<button class="sos" onclick="triggerSOS()">
🚨 SOS
</button>

<button class="sos" onclick="sendToAll()">
📨 Alert All
</button>

<button class="sos" onclick="callPolice()">
📞 Call Police
</button>

<button class="sos" onclick="startVoice()">
🎤 Voice SOS
</button>

<!-- 🚨 Emergency Types Grid -->

<div class="card">

<h3>🚨 Emergency Types</h3>

<div class="emergency-grid">

<button onclick="handleEmergency('HIGH_EMERGENCY')">
🚨 High Emergency
</button>

<button onclick="handleEmergency('CHASING')">
🏃 Chasing
</button>

<button onclick="handleEmergency('KIDNAP')">
⚠️ Kidnap
</button>

<button onclick="handleEmergency('MINOR_ACCIDENT')">
🚑 Minor Accident
</button>

<button onclick="handleEmergency('MAJOR_ACCIDENT')">
🚑 Major Accident
</button>

<button onclick="handleEmergency('UNSAFE_FEELING')">
😟 Unsafe Feeling
</button>

<button onclick="handleEmergency('VEHICLE_BREAKDOWN')">
🚗 Breakdown
</button>

<button onclick="handleEmergency('ISOLATED_AREA')">
🌍 Isolated Area
</button>

</div>

</div>

<!-- Emergency Numbers -->

<div class="card">

<h3>🚨 Emergency Numbers</h3>

<button onclick="window.location.href='tel:100'">
🚓 Call Police (100)
</button>

<button onclick="window.location.href='tel:108'">
🚑 Call Ambulance (108)
</button>

<button onclick="window.location.href='tel:101'">
🔥 Call Fire (101)
</button>

</div>

<!-- Add Contact -->

<div class="card">

<input type="text"
id="name"
placeholder="Name">

<input type="text"
id="phone"
placeholder="Phone">

<button onclick="addContact()">
➕ Add Contact
</button>

</div>

<button onclick="viewContacts()">
📞 View Contacts
</button>

<div id="output"></div>

</div>

</div>

<script>

/* Emergency Map */

const EmergencyMap = {

HIGH_EMERGENCY:
{ level: 10, msg: "I am in serious danger. Help immediately." },

KIDNAP:
{ level: 10, msg: "I am at risk of being kidnapped." },

MAJOR_ACCIDENT:
{ level: 8, msg: "I was involved in a major accident." },

CHASING:
{ level: 6, msg: "Someone is following me." },

VEHICLE_BREAKDOWN:
{ level: 6, msg: "My vehicle broke down." },

ISOLATED_AREA:
{ level: 6, msg: "I am stuck in an isolated area." },

MINOR_ACCIDENT:
{ level: 3, msg: "I had a minor accident." },

UNSAFE_FEELING:
{ level: 2, msg: "I feel unsafe." }

};

/* Contacts */

let contacts =
JSON.parse(localStorage.getItem("contacts")) || [];

/* LOCATION */

function getLocation() {

navigator.geolocation.getCurrentPosition(

(pos) => {

window.lat = pos.coords.latitude;
window.lon = pos.coords.longitude;

document.getElementById("location").innerHTML =
"📍 Location detected";

}

);

}

getLocation();

/* ADD CONTACT */

function addContact() {

let name =
document.getElementById("name").value.trim();

let phone =
document.getElementById("phone").value.trim();

if (!name || !phone) {
output("⚠️ Enter details!");
return;
}

contacts.push({ name, phone });

localStorage.setItem(
"contacts",
JSON.stringify(contacts)
);

output("✅ Contact Saved!");

}

/* VIEW CONTACTS */

function viewContacts() {

if (contacts.length === 0) {
output("No contacts saved");
return;
}

let list = "📞 Contacts:<br>";

contacts.forEach((c, index) => {

list += `
<div class="contact-card">

👤 ${c.name} - ${c.phone}

<div class="action-buttons">

<button onclick="editContact(${index})">
✏️ Edit
</button>

<button onclick="deleteContact(${index})">
❌ Delete
</button>

</div>

</div>
`;

});

output(list);

}

function deleteContact(index) {

contacts.splice(index, 1);

localStorage.setItem(
"contacts",
JSON.stringify(contacts)
);

viewContacts();

}

function editContact(index) {

let newName =
prompt("Edit Name:", contacts[index].name);

let newPhone =
prompt("Edit Phone:", contacts[index].phone);

if (newName && newPhone) {

contacts[index] =
{ name: newName, phone: newPhone };

localStorage.setItem(
"contacts",
JSON.stringify(contacts)
);

viewContacts();

}

}

/* 🚨 MAIN EMERGENCY */

function handleEmergency(type) {

let data = EmergencyMap[type];

let level = data.level;

let message = data.msg;

let mapLink =
window.lat ?
`https://www.google.com/maps?q=${lat},${lon}`
: "";

let numbers =
contacts.map(c => c.phone);

let fullMessage =

`🚨 SOS ALERT 🚨

${message}

📍 Location:
${mapLink}`;

window.location.href =
`sms:${numbers.join(",")}?body=${encodeURIComponent(fullMessage)}`;

if (level >= 7) {
startCalling(numbers, level);
}

}

/* CALL SYSTEM */

function startCalling(numbers, level) {

let repeat =
(level >= 10) ? 3 : 1;

let delay = 0;

for (let r = 0; r < repeat; r++) {

numbers.forEach(num => {

setTimeout(() => {

window.location.href =
`tel:${num}`;

}, delay);

delay += 15000;

});

}

}

/* OUTPUT */

function output(msg) {

document.getElementById("output").innerHTML = msg;

}

/* Splash */

setTimeout(() => {

document.getElementById("splash").style.opacity = "0";

setTimeout(() => {

document.getElementById("splash").style.display = "none";

document.getElementById("mainApp").style.display = "block";

}, 500);

}, 2000);

</script>

</body>
</html>
